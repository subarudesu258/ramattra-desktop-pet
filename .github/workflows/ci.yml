name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build-time dependency (Pillow)
        run: python -m pip install --upgrade pip pillow

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Sprites regenerate cleanly
        run: python tools/gen_sprites.py --preview

      - name: App boots (loads every asset, opens and closes a window)
        run: python -m ramattra_pet --selftest
